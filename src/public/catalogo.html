<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo | Tienda</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <span class="brand">Tienda</span>
    <nav>
      <a href="catalogo.html" class="active">Catálogo</a>
      <a href="usuario.html">Mi cuenta</a>
      <button id="logout-btn" class="link-btn">Cerrar sesión</button>
    </nav>
  </header>

  <main class="content">
    <h1>Catálogo de productos</h1>
    <div id="product-grid" class="product-grid"></div>
  </main>

  <div id="product-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>
      <h2 id="modal-nombre"></h2>
      <p id="modal-descripcion"></p>
      <p><strong>Precio:</strong> $<span id="modal-precio"></span></p>
      <p><strong>Stock:</strong> <span id="modal-stock"></span></p>
    </div>
  </div>

  <script src="js/session.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
