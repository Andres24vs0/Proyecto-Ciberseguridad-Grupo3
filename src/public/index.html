<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | Tienda</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Bienvenido</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Iniciar sesión</button>
      <button class="tab-btn" data-tab="register">Registrarse</button>
    </div>

    <form id="login-form" class="tab-panel active">
      <label for="login-email">Correo</label>
      <input type="email" id="login-email" required>

      <label for="login-pass">Contraseña</label>
      <input type="password" id="login-pass" required>

      <p class="form-message" id="login-message"></p>
      <button type="submit">Entrar</button>
    </form>

    <form id="register-form" class="tab-panel">
      <label for="reg-nombre">Nombre</label>
      <input type="text" id="reg-nombre" required>

      <label for="reg-email">Correo</label>
      <input type="email" id="reg-email" required>

      <label for="reg-pass">Contraseña</label>
      <input type="password" id="reg-pass" required>

      <p class="form-message" id="register-message"></p>
      <button type="submit">Crear cuenta</button>
    </form>
  </main>

  <script src="js/session.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
